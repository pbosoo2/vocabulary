<script>

const revealed=new Set();let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('word-library-saved')||'[]'))}catch{}

const modeNames={spell:'스펠링 맞추기',meaning:'뜻 맞추기',reverse:'뜻 보고 단어 맞추기'};
function koreanReadingText(w){return (w.koreanReading||(w.reading?'자동 변환이 어려워요':'미등록'))+(w.koreanReadingSource==='approximation'?' (근사 표기)':'');}
function numberedText(value){
 const text=String(value??'').replace(/\r\n?/g,'\n').replace(/(^|[ \t\n]+|[,;][ \t\n]*)([1-9]\d{0,2}\.)(?=[ \t\n]|[^\d.])/g,(match,prefix,number,offset)=>offset===0?number:(prefix.trim()===','||prefix.trim()===';'?prefix.trim():'')+'\n'+number).split('\n').map(line=>line.trim()).join('\n').trim();

}
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalize(rows){if(!Array.isArray(rows)||rows.length>10)throw Error('단어 페이지를 확인하지 못했어요.');return rows.map(w=>{if(!w||typeof w.word!=='string'||!['영어','일본어'].includes(w.language))throw Error('단어 형식을 확인하지 못했어요.');return VocabularyPronunciation.enrich(w);});}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function filter(){return {lang,q:$('search').value,sort:$('sort').value,...(lang==='보관'?{favorites:[...saved]}:{})};}
function applyStatus(data){fetchedAt=data.fetchedAt||null;reconciledAt=data.reconciledAt||null;nextRefreshAt=data.nextSyncAt||null;}
function reconciliationLabel(value){const date=value?new Date(value):null;return "최근 목록 대조 · "+(date&&Number.isFinite(date.getTime())?new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(date):"아직 기록이 없어요");}
function render(){shown=actual;$('count').textContent=(lang==='오늘'?'오늘 등록한 단어':lang==='전체'?'전체 단어':lang==='보관'?'보관한 단어':lang+' 단어')+' '+total+'개';$('bannerText').textContent=fetchedAt?'최근 갱신 · '+new Date(fetchedAt).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' (한국 시간)':'최근 갱신 · 아직 갱신하지 않았어요';$('reconciledText').textContent=reconciliationLabel(reconciledAt);$('syncMessage').textContent=loading?(syncMode==='full'?'전체 단어를 다시 저장하고 목록을 대조하고 있어요…':'변경된 단어와 학습 정보를 동기화하고 있어요…'):'';$('syncMessage').hidden=!loading;$('viewMessage').textContent=loadError;$('viewMessage').hidden=!loadError;$('study').disabled=!shown.length||listLoading||quizLoading;$('quiz').disabled=!total||listLoading||quizLoading;updateCountdown();$('grid').setAttribute('aria-busy',String(listLoading));$('grid').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty"><h2>'+(listLoading?'단어를 불러오고 있어요.':'아직 이곳에 단어가 없어요.')+'</h2><p>'+(listLoading?'저장소에서 단어를 확인하고 있습니다.':lang==='오늘'?'오늘 등록된 단어가 없어요. 전체 탭에서 다른 단어를 확인해 보세요.':'검색어나 필터를 바꾸거나 Notion에서 단어를 등록해 주세요.')+'</p></div>';const pages=Math.max(1,Math.ceil(total/10));$('pageLabel').textContent=page+' / '+pages+' 페이지 · 10개씩 보기';$('pagePrev').disabled=page<=1||listLoading;$('pageNext').disabled=page>=pages||listLoading;$('pagination').hidden=total<=10;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));requestAnimationFrame(alignStudyButton);}
function answer(w){return '<p class="meaning">'+numberedText(w.meaning||'뜻 미등록')+'</p>'+(w.example||w.translation?'<div class="example">'+(w.example?'<p>'+numberedText(w.example)+'</p>':'')+(w.translation?'<p>'+numberedText(w.translation)+'</p>':'')+'</div>':'');}
function numberedEntries(value){
 const text=String(value??'').replace(/\r\n?/g,'\n').trim();if(!text)return [];
 const matches=[...text.matchAll(/(^|[ \t\n,;])([1-9]\d{0,2})\.(?=[ \t\n]|[^\d.])/g)];
 if(!matches.length)return [{number:null,text}];const entries=[];const head=text.slice(0,matches[0].index+matches[0][1].length).trim();if(head)entries.push({number:null,text:head});
 matches.forEach((m,i)=>{const from=m.index+m[1].length+m[2].length+1,next=matches[i+1],to=next?next.index+next[1].length:text.length;entries.push({number:Number(m[2]),text:text.slice(from,to).trim()});});return entries;
}
function groupedAnswer(w){
 const fields=['meaning','example','translation'];const parsed=Object.fromEntries(fields.map(key=>[key,numberedEntries(w[key])]));const numbers=[...new Set(fields.flatMap(key=>parsed[key].filter(e=>e.number!==null).map(e=>e.number)))].sort((a,b)=>a-b);
 if(!numbers.length)return answer(w);
 const groups=new Map(numbers.map(number=>[number,{meaning:[],example:[],translation:[]}])) ,loose={meaning:[],example:[],translation:[]};
 for(const key of fields)for(const entry of parsed[key]){if(entry.number===null){if(numbers.length===1)groups.get(numbers[0])[key].push(entry.text);else loose[key].push(entry.text);}else groups.get(entry.number)[key].push(entry.text);}
 const examples=group=>group.example.length||group.translation.length?'<div class="example">'+(group.example.length?'<p>'+numberedText(group.example.join('\n'))+'</p>':'')+(group.translation.length?'<p>'+numberedText(group.translation.join('\n'))+'</p>':'')+'</div>':'';
 let html=loose.meaning.length?'<div class="sense-intro"><p class="meaning">'+numberedText(loose.meaning.join('\n'))+'</p></div>':'';
 html+=numbers.map(number=>{const group=groups.get(number);return '<section class="sense-group" data-sense="'+number+'" aria-label="'+number+'번 뜻과 예문"><p class="meaning"><span class="sense-number">'+number+'.</span> '+(group.meaning.length?numberedText(group.meaning.join('\n')):'예문')+'</p>'+examples(group)+'</section>';}).join('');
 if(loose.example.length||loose.translation.length)html+='<section class="sense-group sense-unmatched"><p class="field-label">번호 없는 예문·해석</p>'+examples(loose)+'</section>';return html;
}
function card(w,i){const visible=!$('hide').checked||revealed.has(w.id),url=safeURL(w.dictionaryUrl);return '<article class="card"><div class="cardtop"><span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><button class="iconbtn '+(saved.has(w.id)?'saved':'')+'" data-action="save" data-i="'+i+'" aria-label="'+esc(w.word)+' 보관" aria-pressed="'+saved.has(w.id)+'">'+(saved.has(w.id)?'★':'☆')+'</button></div><h2 class="word">'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'읽기 미등록')+'</p><p class="korean-reading">한글 발음 · '+esc(koreanReadingText(w))+'</p><div class="answer">'+(visible?groupedAnswer(w):'<button class="reveal" data-action="reveal" data-i="'+i+'">생각한 뒤, 뜻 확인하기</button>')+'</div><div class="cardfoot"><span>'+(w.studyCount==null?'학습 정보 미등록':esc(w.studyCount)+'회 학습')+'<br>'+(w.lastStudied?'최근 '+esc(w.lastStudied):'')+'</span>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">사전 ↗</a>':w.notionUrl?'<a href="'+esc(safeURL(w.notionUrl))+'" target="_blank" rel="noopener noreferrer">원본 ↗</a>':'<span>사전 링크 미등록</span>')+'</div></article>';}
async function readApiResponse(res){const message='서버 연결이 잠시 불안정해요. 새로고침 후 다시 시도해 주세요.';if(!(res.headers.get('content-type')||'').toLowerCase().includes('application/json'))throw Error(message);try{const data=JSON.parse(await res.text());if(!data||typeof data!=='object'||Array.isArray(data))throw Error();return data;}catch{throw Error(message);}}
async function api(url,body){const res=await fetch(url,{...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),credentials:'same-origin',cache:'no-store'});const data=await readApiResponse(res);if(res.status===401){loggedOut('로그인이 만료되었어요. 다시 입력해 주세요.');throw Error('로그인이 필요합니다.');}if(!res.ok)throw Error(data.message||'요청을 완료하지 못했어요.');return data;}
async function loadPage(target=1){if(!session)return;const current=++seq;listLoading=true;loadError='';render();try{const data=await api('/api/words',{...filter(),page:target});if(!session||current!==seq)return null;actual=normalize(data.words);total=data.total;page=data.page;applyStatus(data);loadError=data.lastError||'';revealed.clear();if(!actual.length&&page>1&&total>0){listLoading=false;return loadPage(Math.ceil(total/10));}return data;}catch(e){if(current===seq&&session){loadError=e.message;toast(e.message);}return null;}finally{if(current===seq){listLoading=false;render();}}}
async function syncWords(mode='manual'){if(loading||!session)return;loading=true;syncMode=mode;loadError='';$('refresh').disabled=true;$('fullRefresh').disabled=true;if(mode==='full')$('fullRefresh').textContent='진행 중…';else $('refresh').textContent='동기화 중…';render();try{let data=await api('/api/sync',{mode});while(session&&!data.done){applyStatus(data);$('syncMessage').textContent=(data.syncProgress?.full?'전체 단어를 다시 저장하고 목록을 대조하고 있어요':data.syncProgress?.initial?'기존 단어를 처음 저장하고 있어요':'변경된 단어를 동기화하고 있어요')+' · '+(data.syncProgress?.processed||0)+'건 확인';await new Promise(resolve=>setTimeout(resolve,data.busy?2500:500));if(!session)return;data=await api('/api/sync',{mode:'continue'});}if(!session)return;applyStatus(data);await loadPage(page);}catch(e){if(session){loadError=e.message;nextRefreshAt=Date.now()+REFRESH_INTERVAL;toast(e.message);}}finally{loading=false;$('refresh').disabled=false;$('fullRefresh').disabled=false;$('refresh').textContent='동기화';$('fullRefresh').textContent='전체 동기화';render();}}
function loggedOut(message='비밀번호를 입력해 주세요.'){session=false;seq++;clearInterval(timer);actual=[];shown=[];deck=[];total=0;fetchedAt=null;reconciledAt=null;nextRefreshAt=null;loadError='';if($('quizDialog').open)$('quizDialog').close();clearQuiz();if($('dialog').open)$('dialog').close();$('library').hidden=true;$('accountTools').hidden=true;$('loginPanel').hidden=false;$('loginMessage').textContent=message;$('password').value='';render();}
async function loggedIn(){session=true;$('library').hidden=false;$('accountTools').hidden=false;$('loginPanel').hidden=true;clearInterval(timer);try{localStorage.removeItem('vocabulary-encrypted-cache-v1')}catch{}const data=await loadPage(1);if(session&&data&&!data.lastError){if(data.syncPending)await syncWords('continue');else if(!data.fetchedAt||!data.nextSyncAt||Date.now()>=data.nextSyncAt)await syncWords('auto');}if(session)timer=setInterval(checkRefresh,1000);}
function updateCountdown(){if(loading){$('countdown').textContent='동기화 중…';return;}if(!session||!nextRefreshAt){$('countdown').textContent='다음 갱신까지 —';return;}const seconds=Math.max(0,Math.ceil((nextRefreshAt-Date.now())/1000));$('countdown').textContent='다음 갱신까지 '+[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':');}
function checkRefresh(){updateCountdown();if(session&&!loading&&nextRefreshAt&&Date.now()>=nextRefreshAt&&!document.hidden)syncWords('auto');}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const w=shown[Number(b.dataset.i)];if(!w)return;if(b.dataset.action==='save'){saved.has(w.id)?saved.delete(w.id):saved.add(w.id);try{localStorage.setItem('word-library-saved',JSON.stringify([...saved]))}catch{}if(lang==='보관')loadPage(page);else render();}else if(b.dataset.action==='reveal'){revealed.add(w.id);render();}});

$('pagePrev').onclick=async()=>{await loadPage(page-1);$('library').scrollTo({top:0});};$('pageNext').onclick=async()=>{await loadPage(page+1);$('library').scrollTo({top:0});};
function focusRender(){const w=deck[pos];if(!w)return;$('progress').textContent=((deckPage-1)*10+pos+1)+' / '+deckTotal;$('focus').innerHTML='<span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><h2>'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'')+'</p><p class="korean-reading">한글 발음 · '+esc(koreanReadingText(w))+'</p><div class="focusanswer">'+(flipped?answer(w):'<p style="color:var(--muted)">어떤 뜻인지 떠올려 보세요.</p>')+'</div>';$('flip').textContent=flipped?'뜻 숨기기':'뜻 보기';$('prev').disabled=pos===0&&deckPage===1;$('next').textContent=(deckPage-1)*10+pos+1>=deckTotal?'마치기 ✓':'다음 →';}
async function moveStudy(direction){const next=pos+direction;if(next>=0&&next<deck.length){pos=next;flipped=false;focusRender();return;}if(direction>0&&(deckPage-1)*10+pos+1>=deckTotal){$('dialog').close();toast('공부 화면을 마쳤어요. Notion 학습 기록은 별도로 남겨 주세요.');return;}$('prev').disabled=true;$('next').disabled=true;try{const target=deckPage+direction;if(target<1)return;const data=await api('/api/words',{...deckFilter,page:target});const words=normalize(data.words);if(!session||!$('dialog').open)return;if(!words.length){toast('단어 목록이 변경됐어요. 공부 화면을 다시 열어 주세요.');$('dialog').close();return;}deck=words;deckPage=target;deckTotal=data.total;pos=direction>0?0:deck.length-1;flipped=false;focusRender();}catch(e){toast(e.message);}finally{$('next').disabled=false;if($('dialog').open)focusRender();}}

function wireLetters(){const fields=[...document.querySelectorAll('[data-letter]')];const ready=()=>$('checkAnswer').disabled=!fields.every(x=>/^[a-z]$/i.test(x.value));fields.forEach((input,i)=>{input.oninput=e=>{if(e.isComposing)return;input.value=input.value.replace(/[^a-z]/ig,'').slice(-1);ready();if(input.value&&i<fields.length-1)fields[i+1].focus();};input.oncompositionend=()=>{input.value=input.value.replace(/[^a-z]/ig,'').slice(-1);ready();};input.onkeydown=e=>{if(e.key==='Backspace'&&!input.value&&i>0){e.preventDefault();fields[i-1].value='';fields[i-1].focus();ready();}if(e.key==='ArrowLeft'&&i>0){e.preventDefault();fields[i-1].focus();}if(e.key==='ArrowRight'&&i<fields.length-1){e.preventDefault();fields[i+1].focus();}if(e.key==='Enter'){e.preventDefault();if(!answered&&!$('checkAnswer').disabled)checkAnswer();}};input.onpaste=e=>{e.preventDefault();const text=e.clipboardData.getData('text').replace(/[^a-z]/ig,'');for(let j=0;j<text.length&&i+j<fields.length;j++)fields[i+j].value=text[j];ready();fields[Math.min(fields.length-1,i+text.length)].focus();};});$('letterForm').onsubmit=e=>{e.preventDefault();if(!$('checkAnswer').disabled)checkAnswer();};fields[0].focus();}
function checkAnswer(){if(answered)return;const w=quizDeck[position];let user=selected;if(mode==='spell')user=w.language==='일본어'?jpInput.join(''):[...document.querySelectorAll('[data-letter]')].map(x=>x.value).join('');if(!user)return;const correct=labelFor(w,mode);const ok=mode==='spell'?user.toLowerCase()===w.word.toLowerCase():user===correct;answered=true;if(mode==='spell'&&w.language==='일본어'){document.querySelectorAll('[data-jpchar],#jpUndo,#jpClear').forEach(b=>b.disabled=true);document.querySelectorAll('[data-jpslot]').forEach((b,i)=>b.classList.add(jpInput[i]===spelling(w)[i]?'correct':'incorrect'));}outcomes.push({word:w,ok,user});document.querySelectorAll('[data-letter]').forEach((input,i)=>{input.disabled=true;input.classList.add(input.value.toLowerCase()===w.word[i].toLowerCase()?'correct':'incorrect');});document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;b.classList.remove('selected');if(decodeURIComponent(b.dataset.label)===correct){b.classList.add('correct');b.querySelector('.choice-state').textContent='✓ 정답';}else if(decodeURIComponent(b.dataset.label)===selected){b.classList.add('incorrect');b.querySelector('.choice-state').textContent='선택한 답';}});$('feedback').innerHTML='<div class="feedback '+(ok?'ok':'miss')+'"><strong>'+(ok?'✓ 정답이에요!':'다시 기억해 볼까요?')+'</strong><p>정답: <b>'+numberedText(mode==='meaning'?w.meaning:w.word)+'</b></p><p>'+esc(w.word)+' · '+numberedText(w.meaning)+'</p><p>'+esc(w.reading||'읽기 미등록')+' / 한글 발음: '+esc(koreanReadingText(w))+'</p></div>';$('checkAnswer').disabled=false;$('checkAnswer').textContent=position===quizDeck.length-1?'결과 보기':'다음 문제 →';$('checkAnswer').onclick=()=>{if(position===quizDeck.length-1)renderResults();else{position++;renderQuestion();}};$('checkAnswer').focus();}
function renderResults(){const good=outcomes.filter(x=>x.ok).length,wrong=outcomes.filter(x=>!x.ok);reviewTargets=wrong.map(x=>x.word);$('quizDialogTitle').textContent='퀴즈 결과';$('quizContent').innerHTML='<div class="quiz-body"><span class="scope-chip">'+esc(scopeLabel)+' · '+modeNames[mode]+'</span><h2 class="quiz-title">이번 퀴즈를 마쳤어요.</h2><div class="summary-score">'+good+' <span>/ '+outcomes.length+' 정답</span></div><div class="result-facts"><span>정답 '+good+'개</span><span>다시 볼 단어 '+wrong.length+'개</span></div>'+(wrong.length?'<h3 style="font-size:16px;margin:0">다시 볼 단어</h3><div class="mistake-list">'+wrong.map(x=>'<div class="mistake-item"><strong>'+esc(x.word.word)+'</strong><span>'+numberedText(x.word.meaning)+'</span></div>').join('')+'</div>':'<div class="feedback ok"><strong>모든 단어를 잘 기억했어요.</strong><p>다른 유형으로도 가볍게 도전해 보세요.</p></div>')+'<p class="quiz-note">퀴즈 결과는 이 화면에서만 확인할 수 있어요. 서버나 Notion 학습 기록에 저장되지 않습니다.</p><div class="results-actions"><button class="btn" id="retryWrong" '+(!wrong.length?'disabled':'')+'>틀린 단어만 다시 풀기</button><button class="btn primary" id="retryAll">같은 개수 다시 풀기</button></div></div><div class="quiz-actions"><button class="btn quiet" id="backModes">유형 다시 선택</button><button class="btn" id="finishQuiz">닫기</button></div>';$('retryWrong').onclick=()=>startSession(reviewTargets);$('retryAll').onclick=()=>startSession();$('backModes').onclick=setup;$('finishQuiz').onclick=closeQuiz;$('quizDialog').scrollTop=0;}
$('quiz').onclick=()=>openQuiz();$('quizClose').onclick=closeQuiz;

(async()=>{render();try{const data=await api('/api/auth');if(data.authenticated)await loggedIn();else loggedOut();}catch(e){loggedOut(location.protocol==='file:'?'서버 배포 후 사용할 수 있어요. Vercel 미리보기를 확인해 주세요.':e.message);}})();
</script></body></html>
