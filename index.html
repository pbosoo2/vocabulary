<style>

4px;white-space:nowrap;padding:8px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.tabs{display:flex;gap:4px;padding:4px;background:var(--hover);border-radius:8px}.tab{border:0;background:transparent;border-radius:6px;min-height:44px;padding:8px 16px;font-size:14px;color:var(--muted);font-weight:600}.tab[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px #0000000d}.search{flex:1;min-width:200px;position:relative}.search span{position:absolute;left:14px;top:11px;color:var(--muted)}input[type=search]{width:100%;padding:11px 12px 11px 40px;background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:48px;color:var(--text)}select{padding:11px 12px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;max-width:100%}.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:16px}.toggle{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}.toggle input{width:18px;height:18px;accent-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:20px;min-height:330px;display:flex;flex-direction:column;position:relative}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tag{font-size:14px;color:var(--blue);background:var(--soft);padding:3px 8px;border-radius:4px}.tag.jp{color:var(--jp);background:var(--jpbg)}.iconbtn{background:transparent;border:0;border-radius:6px;min-width:44px;min-height:44px;color:var(--muted);font-size:20px}.iconbtn:hover{background:var(--hover)}.iconbtn.saved{color:var(--blue)}.wordrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.word{font-size:28px;line-height:1.35;letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}.reading{font-size:14px;color:var(--muted);margin:4px 0 20px;min-height:21px;overflow-wrap:anywhere}.korean-reading{font-size:14px;color:var(--muted);margin:-12px 0 20px;overflow-wrap:anywhere}.meaning{font-weight:600;margin:0 0 12px}.example{font-size:14px;line-height:1.65;color:var(--muted);border-left:2px solid var(--border);padding-left:12px;overflow-wrap:anywhere}.example p+p{margin-top:4px}.answer{flex:1;min-height:100px;padding-bottom:16px}.reveal{width:100%;background:var(--bg);border:1px dashed var(--border);border-radius:8px;color:var(--muted);min-height:90px;font-size:14px}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px;border-top:1px solid var(--border);font-size:14px;color:var(--muted);flex-wrap:wrap}.cardfoot a{color:var(--blue);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.cardfoot a:hover{text-decoration:underline}.empty{grid-column:1/-1;text-align:center;background:var(--panel);border:1px dashed var(--border);padding:48px 24px;border-radius:12px}.empty h2{font-size:22px;margin:0 0 8px}.empty p{color:var(--muted);margin-bottom:20px}footer{padding:32px 0 8px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}dialog{padding:0;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);width:min(560px,calc(100% - 32px));max-height:90vh}dialog::backdrop{background:#0009}.dialogtop{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);font-size:14px;color:var(--muted)}.focuscard{padding:32px;text-align:center}.focuscard h2{font-size:40px;margin:24px 0 8px;overflow-wrap:anywhere}.focusanswer{padding:24px 0;min-height:170px}.focuscard .example{text-align:left;max-width:400px;margin:16px auto}.dialogbottom{padding:16px 24px;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--border)}.dialogbottom .btn{flex:1}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:12px 20px;border-radius:8px;max-width:calc(100% - 32px);z-index:10;font-size:14px;box-shadow:0 4px 20px #0002}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}

/* 공부 버튼은 화면에 고정하고, 마지막 카드가 가리지 않도록 여백을 둡니다. */
.wrap{padding-bottom:112px}
.floating-study{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 16px #0002;min-height:52px}
button:disabled{cursor:not-allowed;opacity:.55}
@media(max-width:560px){.tabs{flex-wrap:wrap}.tab{flex:0 1 auto;padding:8px 10px}.intro .floating-study{width:auto;max-width:calc(100% - 32px);right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:14px}.wrap{padding-bottom:104px}}

/* 고정 버튼 전용 하단 영역을 확보해 카드 내용과 겹치지 않게 합니다. */
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{flex-shrink:0}
.wrap{width:100%;flex:1;min-height:0;overflow:auto;margin:0 auto calc(88px + env(safe-area-inset-bottom,0px));padding-bottom:24px;scrollbar-gutter:stable}

.login-shell{flex:1;overflow:auto;display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:440px;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.login-card h1{font-size:32px}.login-card>p{color:var(--muted)}.login-card label{display:block;font-size:14px;font-weight:600;margin:32px 0 8px}
.login-card input{width:100%;min-height:48px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.login-card>.btn{width:100%;margin-top:16px}.login-card .login-status{font-size:14px;margin-top:16px;min-height:42px}.login-card small{display:block;font-size:14px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;margin-top:16px}
@media(max-width:560px){.login-card{padding:24px}.login-card h1{font-size:28px}}
</style></head><body>
<header><div class="top"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1zM12 5v15"/></svg><div>단어의 서재 <small>Word Library</small></div></div><div class="tools" id="accountTools" hidden><button class="btn" id="refresh">새로고침</button><button class="btn quiet" id="logout">로그아웃</button></div></div></header>
<section class="login-shell" id="loginPanel"><form class="login-card" id="loginForm"><div class="eyebrow">YOUR PRIVATE LIBRARY</div><h1>나만의 단어 서재.</h1><p>비밀번호로 문을 열고,<br>오늘의 단어를 만나보세요.</p><label for="password">서재 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="512" placeholder="비밀번호 입력"><button class="btn primary" id="loginSubmit" type="submit">서재 열기 →</button><p class="login-status" id="loginMessage" role="status">로그인 상태를 확인하고 있어요.</p><small>단어 데이터는 로그인한 뒤에만 불러옵니다.</small></form></section>
<main class="wrap" id="library" hidden><section class="intro"><div><div class="eyebrow">A LITTLE, EVERY DAY</div><h1>오늘도, 한 단어 가까이.</h1><p>영어와 일본어를 내 속도로 익히는 작은 서재.</p></div><button class="btn primary floating-study" id="study">한 장씩 공부하기 →</button></section>
<div class="banner" id="banner"><span id="bannerText"></span></div>
<section aria-label="단어 검색 및 필터"><div class="toolbar"><div class="tabs" aria-label="단어 필터"><button class="tab" data-lang="오늘" aria-pressed="true">오늘 등록</button><button class="tab" data-lang="영어" aria-pressed="false">영어</button><button class="tab" data-lang="일본어" aria-pressed="false">일본어</button><button class="tab" data-lang="보관" aria-pressed="false">☆ 보관</button><button class="tab" data-lang="전체" aria-pressed="false">전체</button></div><label class="search"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></span><span class="sr">단어, 뜻 또는 읽기 검색</span><input id="search" type="search" placeholder="단어, 뜻, 한글 발음 검색…"></label><label><span class="sr">정렬 기준</span><select id="sort"><option value="original">등록 순서</option><option value="az">단어순</option><option value="least">학습 횟수 적은 순</option></select></label></div><div class="meta"><span id="count" role="status"></span><label class="toggle"><input type="checkbox" id="hide">한국어 뜻 숨기기</label></div></section>
<section class="grid" id="grid" aria-label="단어 카드"></section><footer><span>매일 조금씩, 오래 기억하기.</span><span>Notion 연결 · 읽기 전용</span></footer></main>
<dialog id="dialog" aria-label="한 장씩 공부하기"><div class="dialogtop"><span id="progress"></span><button class="iconbtn" id="close" aria-label="공부 화면 닫기">×</button></div><div class="focuscard" id="focus"></div><div class="dialogbottom"><button class="btn" id="prev">← 이전</button><button class="btn primary" id="flip">뜻 보기</button><button class="btn" id="next">다음 →</button></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
// 단어 데이터는 인증된 서버 /api/words에서만 가져옵니다. 비밀키는 여기에 넣지 마세요.
const WORDS=[];
function todayKey(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
const DEMO=[];
const $=id=>document.getElementById(id);let actual=WORDS.slice(),demo=false,lang='오늘',shown=[],revealed=new Set(),deck=[],pos=0,flipped=false;
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('word-library-saved')||'[]'))}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalize(rows){if(!Array.isArray(rows))throw Error('배열 또는 {words: [...]} 형식이어야 합니다.');if(rows.length>10000)throw Error('한 번에 최대 10,000개까지 불러올 수 있어요.');return rows.map((w,i)=>{if(!w||typeof w.word!=='string'||!w.word.trim())throw Error((i+1)+'번째 단어의 word 값을 확인해 주세요.');if(!['영어','일본어'].includes(w.language))throw Error((i+1)+'번째 단어의 language는 영어 또는 일본어여야 합니다.');return {id:String(w.id||'word-'+i+'-'+w.word),word:w.word,language:w.language,registeredDate:typeof w.registeredDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(w.registeredDate)?w.registeredDate:null,reading:String(w.reading||''),koreanReading:String(w.koreanReading||''),meaning:String(w.meaning||''),example:String(w.example||''),translation:String(w.translation||''),dictionaryUrl:safeURL(w.dictionaryUrl),notionUrl:safeURL(w.notionUrl),studyCount:typeof w.studyCount==='number'&&Number.isFinite(w.studyCount)&&w.studyCount>=0?w.studyCount:null,lastStudied:typeof w.lastStudied==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(w.lastStudied)?w.lastStudied:null}})}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function render(){const q=$('search').value.toLocaleLowerCase();shown=(demo?DEMO:actual).filter(w=>(lang==='전체'||lang==='오늘'&&w.registeredDate===todayKey()||lang==='보관'&&saved.has(w.id)||w.language===lang)&&[w.word,w.meaning,w.reading,w.koreanReading].some(x=>(x||'').toLocaleLowerCase().includes(q)));if($('sort').value==='az')shown.sort((a,b)=>a.word.localeCompare(b.word));if($('sort').value==='least')shown.sort((a,b)=>(a.studyCount??Infinity)-(b.studyCount??Infinity));$('count').textContent=(demo?'예시 · ':'')+(lang==='오늘'?'오늘 등록한 단어':lang==='전체'?'전체 단어':lang==='보관'?'보관한 단어':lang+' 단어')+' '+shown.length+'개';$('bannerText').textContent=loadError|| (loading?'Notion에서 단어를 읽고 있어요…':fetchedAt?'Notion에서 읽어온 단어 · 최근 갱신 '+new Date(fetchedAt).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'})+' · 60초마다 확인':'단어를 불러올 준비가 되었어요.');$('study').disabled=!shown.length;$('grid').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty"><h2>아직 이곳에 단어가 없어요.</h2><p>'+(lang==='오늘'?(actual.length?'오늘 등록된 단어가 없어요. 전체 탭에서 모든 단어를 확인할 수 있습니다.':'Notion에서 오늘 날짜로 등록한 단어가 여기 표시됩니다.'):(actual.length||demo?'검색어나 필터를 바꿔 보세요.':'Notion 단어장에서 단어를 등록해 주세요.'))+'</p></div>';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))}
function answer(w){return '<p class="meaning">'+esc(w.meaning||'뜻 미등록')+'</p>'+(w.example||w.translation?'<div class="example">'+(w.example?'<p>'+esc(w.example)+'</p>':'')+(w.translation?'<p>'+esc(w.translation)+'</p>':'')+'</div>':'')}
function card(w,i){const visible=!$('hide').checked||revealed.has(w.id),url=safeURL(w.dictionaryUrl);return '<article class="card"><div class="cardtop"><span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><button class="iconbtn '+(saved.has(w.id)?'saved':'')+'" data-action="save" data-i="'+i+'" aria-label="'+esc(w.word)+' 보관" aria-pressed="'+saved.has(w.id)+'">'+(saved.has(w.id)?'★':'☆')+'</button></div><div class="wordrow"><h2 class="word">'+esc(w.word)+'</h2></div><p class="reading">'+esc(w.reading||'읽기 미등록')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+(demo?' (근사 표기)':'')+'</p><div class="answer">'+(visible?answer(w):'<button class="reveal" data-action="reveal" data-i="'+i+'">생각한 뒤, 뜻 확인하기</button>')+'</div><div class="cardfoot"><span>'+(demo?'예시 데이터':w.studyCount==null?'학습 정보 미등록':esc(w.studyCount)+'회 학습')+'<br>'+(w.lastStudied?'최근 '+esc(w.lastStudied):'')+'</span>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">사전 ↗</a>':w.notionUrl?'<a href="'+esc(safeURL(w.notionUrl))+'" target="_blank" rel="noopener noreferrer">원본 ↗</a>':'<span>사전 링크 미등록</span>')+'</div></article>'}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const w=shown[Number(b.dataset.i)];if(b.dataset.action==='save'){saved.has(w.id)?saved.delete(w.id):saved.add(w.id);try{localStorage.setItem('word-library-saved',JSON.stringify([...saved]))}catch{}render()}else if(b.dataset.action==='reveal'){revealed.add(w.id);render()}});
$('search').oninput=render;$('sort').onchange=render;$('hide').onchange=()=>{revealed.clear();render()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
function focusRender(){const w=deck[pos];$('progress').textContent=(demo?'예시 공부 · ':'')+(pos+1)+' / '+deck.length;$('focus').innerHTML='<span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><h2>'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+(demo?' (근사 표기)':'')+'</p><div class="focusanswer">'+(flipped?answer(w):'<p style="color:var(--muted)">어떤 뜻인지 떠올려 보세요.</p>')+'</div>';$('flip').textContent=flipped?'뜻 숨기기':'뜻 보기';$('prev').disabled=pos===0;$('next').textContent=pos===deck.length-1?'마치기 ✓':'다음 →'}
$('study').onclick=()=>{deck=shown.slice();pos=0;flipped=false;focusRender();$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();$('flip').onclick=()=>{flipped=!flipped;focusRender()};$('prev').onclick=()=>{if(pos){pos--;flipped=false;focusRender()}};$('next').onclick=()=>{if(pos===deck.length-1){$('dialog').close();toast('공부 화면을 마쳤어요. Notion 학습 기록은 별도로 남겨 주세요.')}else{pos++;flipped=false;focusRender()}};$('dialog').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}});

let loading=false,loadError='',fetchedAt=null,session=false,timer=null;
function loggedOut(message='비밀번호를 입력해 주세요.'){
 session=false;clearInterval(timer);actual=[];shown=[];deck=[];if($('dialog').open)$('dialog').close();$('library').hidden=true;$('accountTools').hidden=true;$('loginPanel').hidden=false;$('loginMessage').textContent=message;$('password').value='';render();
}
function loggedIn(){session=true;$('library').hidden=false;$('accountTools').hidden=false;$('loginPanel').hidden=true;clearInterval(timer);timer=setInterval(()=>{if(session&&!document.hidden)loadWords()},60000);}
async function loadWords(){if(loading||!session)return;loading=true;loadError='';$('refresh').disabled=true;render();try{
 const res=await fetch('/api/words',{credentials:'same-origin',cache:'no-store'});const data=await res.json();if(res.status===401){loggedOut('로그인이 만료되었어요. 다시 입력해 주세요.');return;}if(!res.ok)throw Error(data.message||'단어를 읽지 못했어요.');if(!session)return;actual=normalize(data.words);fetchedAt=data.fetchedAt;revealed.clear();
 }catch(e){loadError=e.message||'네트워크 연결을 확인해 주세요.';}finally{loading=false;$('refresh').disabled=false;render();}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;$('loginMessage').textContent='서재를 여는 중…';try{const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('password').value})});const data=await res.json();$('password').value='';if(!res.ok)throw Error(data.message||'로그인하지 못했어요.');loggedIn();await loadWords();}catch(err){$('loginMessage').textContent=err.message||'연결을 확인해 주세요.';}finally{$('loginSubmit').disabled=false;}};
$('logout').onclick=async()=>{try{const res=await fetch('/api/auth',{method:'DELETE',credentials:'same-origin'});if(!res.ok)throw Error();loggedOut('로그아웃했어요.');}catch{toast('로그아웃 요청에 실패했어요. 다시 시도해 주세요.');}};
$('refresh').onclick=loadWords;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)loadWords();});
(async()=>{render();try{const res=await fetch('/api/auth',{credentials:'same-origin',cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.message||'로그인 설정을 확인해 주세요.');if(data.authenticated){loggedIn();await loadWords();}else loggedOut();}catch(e){loggedOut(location.protocol==='file:'?'서버 배포 후 사용할 수 있어요. Vercel 미리보기를 확인해 주세요.':e.message);}})();
</script></body></html>
