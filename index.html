<style>

argin:4px 0 20px;min-height:21px;overflow-wrap:anywhere}.korean-reading{font-size:14px;color:var(--muted);margin:-12px 0 20px;overflow-wrap:anywhere}.meaning{font-weight:600;margin:0 0 12px}.example{font-size:14px;line-height:1.65;color:var(--muted);border-left:2px solid var(--border);padding-left:12px;overflow-wrap:anywhere}.example p+p{margin-top:4px}.answer{flex:1;min-height:100px;padding-bottom:16px}.reveal{width:100%;background:var(--bg);border:1px dashed var(--border);border-radius:8px;color:var(--muted);min-height:90px;font-size:14px}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px;border-top:1px solid var(--border);font-size:14px;color:var(--muted);flex-wrap:wrap}.cardfoot a{color:var(--blue);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.cardfoot a:hover{text-decoration:underline}.empty{grid-column:1/-1;text-align:center;background:var(--panel);border:1px dashed var(--border);padding:48px 24px;border-radius:12px}.empty h2{font-size:22px;margin:0 0 8px}.empty p{color:var(--muted);margin-bottom:20px}footer{padding:32px 0 8px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}dialog{padding:0;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);width:min(560px,calc(100% - 32px));max-height:90vh}dialog::backdrop{background:#0009}.dialogtop{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);font-size:14px;color:var(--muted)}.focuscard{padding:32px;text-align:center}.focuscard h2{font-size:40px;margin:24px 0 8px;overflow-wrap:anywhere}.focusanswer{padding:24px 0;min-height:170px}.focuscard .example{text-align:left;max-width:400px;margin:16px auto}.dialogbottom{padding:16px 24px;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--border)}.dialogbottom .btn{flex:1}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:12px 20px;border-radius:8px;max-width:calc(100% - 32px);z-index:10;font-size:14px;box-shadow:0 4px 20px #0002}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}

/* 공부 버튼은 화면에 고정하고, 마지막 카드가 가리지 않도록 여백을 둡니다. */
.wrap{padding-bottom:112px}
.floating-study{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 16px #0002;min-height:52px}
button:disabled{cursor:not-allowed;opacity:.55}
@media(max-width:560px){.tabs{flex-wrap:wrap}.tab{flex:0 1 auto;padding:8px 10px}.floating-study{width:auto;max-width:calc(100% - 32px);right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:14px}.wrap{padding-bottom:104px}}

/* 고정 버튼 전용 하단 영역을 확보해 카드 내용과 겹치지 않게 합니다. */
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{flex-shrink:0}
.wrap{width:100%;flex:1;min-height:0;overflow:auto;margin:0 auto calc(88px + env(safe-area-inset-bottom,0px));padding-bottom:24px;scrollbar-gutter:stable}

.login-shell{flex:1;overflow:auto;display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:440px;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.login-card h1{font-size:32px}.login-card>p{color:var(--muted)}.login-card label{display:block;font-size:14px;font-weight:600;margin:32px 0 8px}
.login-card input{width:100%;min-height:48px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.login-card>.btn{width:100%;margin-top:16px}.login-card .login-status{font-size:14px;margin-top:16px;min-height:42px}.login-card small{display:block;font-size:14px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;margin-top:16px}
@media(max-width:560px){.login-card{padding:24px}.login-card h1{font-size:28px}}

.sync-details{display:flex;flex-direction:column;gap:6px}.sync-next{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}.sync-period{font-size:14px;color:var(--blue);white-space:nowrap}.sync-message{font-size:14px;color:var(--muted);margin-top:4px}
@media(max-width:560px){.banner{gap:12px}.sync-period{font-size:14px}}

/* 카드 영역과 같은 너비의 고정 공부 버튼 */
.floating-study{left:24px;right:auto;width:calc(100% - 48px);max-width:none;transform:none}
@media(max-width:560px){.floating-study{left:16px;right:auto;width:calc(100% - 32px);max-width:none}}
.login-external{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:14px;color:var(--blue);text-decoration:none}.login-external:hover{text-decoration:underline}

/* 접힌 상태가 기본인 갱신 정보와 같은 너비의 필터 메뉴 */
.sync-panel{display:block;padding:0}
.sync-panel summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 16px;cursor:pointer;font-weight:600;list-style:none}
.sync-panel summary::-webkit-details-marker{display:none}
.sync-panel summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.sync-chevron{flex-shrink:0}.sync-panel[open] .sync-chevron{transform:rotate(180deg)}
.sync-body{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px 16px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tab{min-width:0;padding:8px 10px;text-align:center;word-break:keep-all}
@media(max-width:560px){.tabs{width:100%}.tab{padding:8px 4px}.sync-body{flex-direction:column;align-items:flex-start;gap:12px}}
.pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px;font-size:14px;color:var(--muted)}.view-message{font-size:14px;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:0 0 16px;background:var(--panel)}@media(max-width:560px){.pagination{gap:8px}.pagination .btn{padding:8px 12px}.pagination span{text-align:center}}

/* 좁은 화면에서는 제목과 세 버튼을 두 줄로 나누어 균일하게 배치 */
@media(max-width:560px){.top{flex-wrap:wrap;gap:12px}.top .tools{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.top .tools .btn{padding:8px 4px;white-space:nowrap}.logo{min-height:28px}}
</style></head><body>
<header><div class="top"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1zM12 5v15"/></svg><div>단어장</div></div><div class="tools" id="accountTools" hidden><button class="btn" id="refresh" title="추가·수정된 단어와 학습 기록만 동기화">동기화</button><button class="btn" id="fullRefresh" title="전체 단어를 다시 저장하고 삭제·보관된 항목도 대조" aria-label="전체 동기화 및 목록 대조">전체 동기화</button><button class="btn quiet" id="logout">로그아웃</button></div></div></header>
<section class="login-shell" id="loginPanel"><form class="login-card" id="loginForm"><div class="eyebrow">YOUR PRIVATE LIBRARY</div><h1>나만의 단어장.</h1><p>비밀번호로 문을 열고,<br>오늘의 단어를 만나보세요.</p><label for="password">단어장 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="512" placeholder="비밀번호 입력"><button class="btn primary" id="loginSubmit" type="submit">로그인 →</button><p class="login-status" id="loginMessage" role="status">로그인 상태를 확인하고 있어요.</p><small>단어 데이터는 로그인한 뒤에만 불러옵니다.</small><a class="login-external" href="https://vocabulary-five-beryl.vercel.app/" target="_blank" rel="noopener noreferrer">브라우저에서 열기 ↗</a></form></section>
<main class="wrap" id="library" hidden><button class="btn primary floating-study" id="study">한 장씩 공부하기 →</button>
<details class="banner sync-panel" id="banner"><summary>최근 갱신 정보<svg class="sync-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="sync-body"><div class="sync-details"><span id="bannerText"></span><span class="sync-next" id="countdown">다음 갱신까지 —</span><p class="sync-message" id="syncMessage" role="status" hidden></p></div><span class="sync-period">자동 갱신 · 1시간</span></div></details>
<section aria-label="단어 검색 및 필터"><div class="toolbar"><div class="tabs" aria-label="단어 필터"><button class="tab" data-lang="오늘" aria-pressed="true">오늘 등록</button><button class="tab" data-lang="영어" aria-pressed="false">영어</button><button class="tab" data-lang="일본어" aria-pressed="false">일본어</button><button class="tab" data-lang="보관" aria-pressed="false">☆ 보관</button><button class="tab" data-lang="전체" aria-pressed="false">전체</button></div><label class="search"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></span><span class="sr">단어, 뜻 또는 읽기 검색</span><input id="search" type="search" placeholder="단어, 뜻, 한글 발음 검색…"></label><label><span class="sr">정렬 기준</span><select id="sort"><option value="original">등록 순서</option><option value="az">단어순</option><option value="least">학습 횟수 적은 순</option></select></label></div><div class="meta"><span id="count" role="status"></span><label class="toggle"><input type="checkbox" id="hide">한국어 뜻 숨기기</label></div></section>
<p class="view-message" id="viewMessage" role="status" hidden></p><section class="grid" id="grid" aria-label="단어 카드"></section><nav class="pagination" id="pagination" aria-label="단어 페이지" hidden><button class="btn" id="pagePrev">← 이전</button><span id="pageLabel" role="status"></span><button class="btn" id="pageNext">다음 →</button></nav><footer><span>Notion 연결 · 읽기 전용</span></footer></main>
<dialog id="dialog" aria-label="한 장씩 공부하기"><div class="dialogtop"><span id="progress"></span><button class="iconbtn" id="close" aria-label="공부 화면 닫기">×</button></div><div class="focuscard" id="focus"></div><div class="dialogbottom"><button class="btn" id="prev">← 이전</button><button class="btn primary" id="flip">뜻 보기</button><button class="btn" id="next">다음 →</button></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
// All words are read in authenticated ten-record pages; no credentials or word cache are persisted in the browser.
const $=id=>document.getElementById(id),REFRESH_INTERVAL=60*60*1000;
let syncMode='manual';let actual=[],shown=[],lang='오늘',page=1,total=0,session=false,loading=false,listLoading=false,loadError='',fetchedAt=null,nextRefreshAt=null,timer=null,seq=0,searchTimer=null,deck=[],pos=0,flipped=false,deckPage=1,deckTotal=0,deckFilter=null;
const revealed=new Set();let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('word-library-saved')||'[]'))}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalize(rows){if(!Array.isArray(rows)||rows.length>10)throw Error('단어 페이지를 확인하지 못했어요.');return rows.map(w=>{if(!w||typeof w.word!=='string'||!['영어','일본어'].includes(w.language))throw Error('단어 형식을 확인하지 못했어요.');return w;});}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function filter(){return {lang,q:$('search').value,sort:$('sort').value,...(lang==='보관'?{favorites:[...saved]}:{})};}
function applyStatus(data){fetchedAt=data.fetchedAt||null;nextRefreshAt=data.nextSyncAt||null;}
function render(){shown=actual;$('count').textContent=(lang==='오늘'?'오늘 등록한 단어':lang==='전체'?'전체 단어':lang==='보관'?'보관한 단어':lang+' 단어')+' '+total+'개';$('bannerText').textContent=fetchedAt?'최근 갱신 · '+new Date(fetchedAt).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' (한국 시간)':'최근 갱신 · 아직 갱신하지 않았어요';$('syncMessage').textContent=loading?(syncMode==='full'?'전체 단어를 다시 저장하고 목록을 대조하고 있어요…':'변경된 단어와 학습 정보를 동기화하고 있어요…'):'';$('syncMessage').hidden=!loading;$('viewMessage').textContent=loadError;$('viewMessage').hidden=!loadError;$('study').disabled=!shown.length||listLoading;updateCountdown();$('grid').setAttribute('aria-busy',String(listLoading));$('grid').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty"><h2>'+(listLoading?'단어를 불러오고 있어요.':'아직 이곳에 단어가 없어요.')+'</h2><p>'+(listLoading?'저장소에서 단어를 확인하고 있습니다.':lang==='오늘'?'오늘 등록된 단어가 없어요. 전체 탭에서 다른 단어를 확인해 보세요.':'검색어나 필터를 바꾸거나 Notion에서 단어를 등록해 주세요.')+'</p></div>';const pages=Math.max(1,Math.ceil(total/10));$('pageLabel').textContent=page+' / '+pages+' 페이지 · 10개씩 보기';$('pagePrev').disabled=page<=1||listLoading;$('pageNext').disabled=page>=pages||listLoading;$('pagination').hidden=total<=10;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));requestAnimationFrame(alignStudyButton);}
function answer(w){return '<p class="meaning">'+esc(w.meaning||'뜻 미등록')+'</p>'+(w.example||w.translation?'<div class="example">'+(w.example?'<p>'+esc(w.example)+'</p>':'')+(w.translation?'<p>'+esc(w.translation)+'</p>':'')+'</div>':'');}
function card(w,i){const visible=!$('hide').checked||revealed.has(w.id),url=safeURL(w.dictionaryUrl);return '<article class="card"><div class="cardtop"><span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><button class="iconbtn '+(saved.has(w.id)?'saved':'')+'" data-action="save" data-i="'+i+'" aria-label="'+esc(w.word)+' 보관" aria-pressed="'+saved.has(w.id)+'">'+(saved.has(w.id)?'★':'☆')+'</button></div><h2 class="word">'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'읽기 미등록')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+'</p><div class="answer">'+(visible?answer(w):'<button class="reveal" data-action="reveal" data-i="'+i+'">생각한 뒤, 뜻 확인하기</button>')+'</div><div class="cardfoot"><span>'+(w.studyCount==null?'학습 정보 미등록':esc(w.studyCount)+'회 학습')+'<br>'+(w.lastStudied?'최근 '+esc(w.lastStudied):'')+'</span>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">사전 ↗</a>':w.notionUrl?'<a href="'+esc(safeURL(w.notionUrl))+'" target="_blank" rel="noopener noreferrer">원본 ↗</a>':'<span>사전 링크 미등록</span>')+'</div></article>';}
async function readApiResponse(res){const message='서버 연결이 잠시 불안정해요. 새로고침 후 다시 시도해 주세요.';if(!(res.headers.get('content-type')||'').toLowerCase().includes('application/json'))throw Error(message);try{const data=JSON.parse(await res.text());if(!data||typeof data!=='object'||Array.isArray(data))throw Error();return data;}catch{throw Error(message);}}
async function api(url,body){const res=await fetch(url,{...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),credentials:'same-origin',cache:'no-store'});const data=await readApiResponse(res);if(res.status===401){loggedOut('로그인이 만료되었어요. 다시 입력해 주세요.');throw Error('로그인이 필요합니다.');}if(!res.ok)throw Error(data.message||'요청을 완료하지 못했어요.');return data;}
async function loadPage(target=1){if(!session)return;const current=++seq;listLoading=true;loadError='';render();try{const data=await api('/api/words',{...filter(),page:target});if(!session||current!==seq)return null;actual=normalize(data.words);total=data.total;page=data.page;applyStatus(data);loadError=data.lastError||'';revealed.clear();if(!actual.length&&page>1&&total>0){listLoading=false;return loadPage(Math.ceil(total/10));}return data;}catch(e){if(current===seq&&session){loadError=e.message;toast(e.message);}return null;}finally{if(current===seq){listLoading=false;render();}}}
async function syncWords(mode='manual'){if(loading||!session)return;loading=true;syncMode=mode;loadError='';$('refresh').disabled=true;$('fullRefresh').disabled=true;if(mode==='full')$('fullRefresh').textContent='진행 중…';else $('refresh').textContent='동기화 중…';render();try{let data=await api('/api/sync',{mode});while(session&&!data.done){applyStatus(data);$('syncMessage').textContent=(data.syncProgress?.full?'전체 단어를 다시 저장하고 목록을 대조하고 있어요':data.syncProgress?.initial?'기존 단어를 처음 저장하고 있어요':'변경된 단어를 동기화하고 있어요')+' · '+(data.syncProgress?.processed||0)+'건 확인';await new Promise(resolve=>setTimeout(resolve,data.busy?2500:500));if(!session)return;data=await api('/api/sync',{mode:'continue'});}if(!session)return;applyStatus(data);await loadPage(page);}catch(e){if(session){loadError=e.message;nextRefreshAt=Date.now()+REFRESH_INTERVAL;toast(e.message);}}finally{loading=false;$('refresh').disabled=false;$('fullRefresh').disabled=false;$('refresh').textContent='동기화';$('fullRefresh').textContent='전체 동기화';render();}}
function loggedOut(message='비밀번호를 입력해 주세요.'){session=false;seq++;clearInterval(timer);actual=[];shown=[];deck=[];total=0;fetchedAt=null;nextRefreshAt=null;loadError='';if($('dialog').open)$('dialog').close();$('library').hidden=true;$('accountTools').hidden=true;$('loginPanel').hidden=false;$('loginMessage').textContent=message;$('password').value='';render();}
async function loggedIn(){session=true;$('library').hidden=false;$('accountTools').hidden=false;$('loginPanel').hidden=true;clearInterval(timer);try{localStorage.removeItem('vocabulary-encrypted-cache-v1')}catch{}const data=await loadPage(1);if(session&&data&&!data.lastError){if(data.syncPending)await syncWords('continue');else if(!data.fetchedAt||!data.nextSyncAt||Date.now()>=data.nextSyncAt)await syncWords('auto');}if(session)timer=setInterval(checkRefresh,1000);}
function updateCountdown(){if(loading){$('countdown').textContent='동기화 중…';return;}if(!session||!nextRefreshAt){$('countdown').textContent='다음 갱신까지 —';return;}const seconds=Math.max(0,Math.ceil((nextRefreshAt-Date.now())/1000));$('countdown').textContent='다음 갱신까지 '+[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':');}
function checkRefresh(){updateCountdown();if(session&&!loading&&nextRefreshAt&&Date.now()>=nextRefreshAt&&!document.hidden)syncWords('auto');}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const w=shown[Number(b.dataset.i)];if(!w)return;if(b.dataset.action==='save'){saved.has(w.id)?saved.delete(w.id):saved.add(w.id);try{localStorage.setItem('word-library-saved',JSON.stringify([...saved]))}catch{}if(lang==='보관')loadPage(page);else render();}else if(b.dataset.action==='reveal'){revealed.add(w.id);render();}});
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadPage(1),250);};$('sort').onchange=()=>loadPage(1);$('hide').onchange=()=>{revealed.clear();render();};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;loadPage(1);});
$('pagePrev').onclick=async()=>{await loadPage(page-1);$('library').scrollTo({top:0});};$('pageNext').onclick=async()=>{await loadPage(page+1);$('library').scrollTo({top:0});};
function focusRender(){const w=deck[pos];if(!w)return;$('progress').textContent=((deckPage-1)*10+pos+1)+' / '+deckTotal;$('focus').innerHTML='<span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><h2>'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+'</p><div class="focusanswer">'+(flipped?answer(w):'<p style="color:var(--muted)">어떤 뜻인지 떠올려 보세요.</p>')+'</div>';$('flip').textContent=flipped?'뜻 숨기기':'뜻 보기';$('prev').disabled=pos===0&&deckPage===1;$('next').textContent=(deckPage-1)*10+pos+1>=deckTotal?'마치기 ✓':'다음 →';}
async function moveStudy(direction){const next=pos+direction;if(next>=0&&next<deck.length){pos=next;flipped=false;focusRender();return;}if(direction>0&&(deckPage-1)*10+pos+1>=deckTotal){$('dialog').close();toast('공부 화면을 마쳤어요. Notion 학습 기록은 별도로 남겨 주세요.');return;}$('prev').disabled=true;$('next').disabled=true;try{const target=deckPage+direction;if(target<1)return;const data=await api('/api/words',{...deckFilter,page:target});const words=normalize(data.words);if(!session||!$('dialog').open)return;if(!words.length){toast('단어 목록이 변경됐어요. 공부 화면을 다시 열어 주세요.');$('dialog').close();return;}deck=words;deckPage=target;deckTotal=data.total;pos=direction>0?0:deck.length-1;flipped=false;focusRender();}catch(e){toast(e.message);}finally{$('next').disabled=false;if($('dialog').open)focusRender();}}
$('study').onclick=()=>{if(!shown.length)return;deck=shown.slice();deckPage=page;deckTotal=total;deckFilter=filter();pos=0;flipped=false;focusRender();$('dialog').showModal();};$('close').onclick=()=>$('dialog').close();$('flip').onclick=()=>{flipped=!flipped;focusRender();};$('prev').onclick=()=>moveStudy(-1);$('next').onclick=()=>moveStudy(1);$('dialog').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('next').click();e.preventDefault();}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault();}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;$('loginMessage').textContent='로그인 중…';try{const data=await api('/api/auth',{password:$('password').value});$('password').value='';const checked=await api('/api/auth');if(!checked.authenticated)throw Error('이 브라우저에서 임베드 로그인 쿠키를 사용할 수 없어요. 아래의 브라우저에서 열기를 이용해 주세요.');await loggedIn();}catch(err){$('password').value='';$('loginMessage').textContent=err.message||'연결을 확인해 주세요.';}finally{$('loginSubmit').disabled=false;}};
$('logout').onclick=async()=>{try{const res=await fetch('/api/auth',{method:'DELETE',credentials:'same-origin'});if(!res.ok)throw Error();loggedOut('로그아웃했어요.');}catch{toast('로그아웃 요청에 실패했어요. 다시 시도해 주세요.');}};$('refresh').onclick=()=>syncWords('manual');$('fullRefresh').onclick=()=>syncWords('full');
function alignStudyButton(){if($('library').hidden)return;const rect=$('grid').getBoundingClientRect();if(rect.width>0){$('study').style.left=rect.left+'px';$('study').style.width=rect.width+'px';}}
new ResizeObserver(alignStudyButton).observe($('library'));window.addEventListener('resize',alignStudyButton);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)checkRefresh();});
(async()=>{render();try{const data=await api('/api/auth');if(data.authenticated)await loggedIn();else loggedOut();}catch(e){loggedOut(location.protocol==='file:'?'서버 배포 후 사용할 수 있어요. Vercel 미리보기를 확인해 주세요.':e.message);}})();
</script></body></html>
