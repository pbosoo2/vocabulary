<script>

const WORDS=[];
function todayKey(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
const DEMO=[
{registeredDate:todayKey(),id:'demo-1',word:'serendipity',koreanReading:'세런디피티',language:'영어',reading:'/ˌser.ənˈdɪp.ə.ti/',meaning:'뜻밖의 행운, 우연한 발견',example:'Finding this book was pure serendipity.',translation:'이 책을 발견한 것은 순전히 뜻밖의 행운이었다.'},
{registeredDate:todayKey(),id:'demo-2',word:'木漏れ日',koreanReading:'코모레비',language:'일본어',reading:'こもれび',meaning:'나뭇잎 사이로 비치는 햇빛',example:'木漏れ日がきれいですね。',translation:'나뭇잎 사이로 비치는 햇빛이 예쁘네요.'},
{registeredDate:todayKey(),id:'demo-3',word:'curiosity',koreanReading:'큐리오서티',language:'영어',reading:'/ˌkjʊr.iˈɑː.sə.t̬i/',meaning:'호기심',example:'Curiosity opens the door to learning.',translation:'호기심은 배움의 문을 열어 준다.'},
{registeredDate:todayKey(),id:'demo-4',word:'穏やか',koreanReading:'오다야카',language:'일본어',reading:'おだやか',meaning:'평온한, 온화한',example:'今日は穏やかな一日でした。',translation:'오늘은 평온한 하루였습니다.'},
{registeredDate:todayKey(),id:'demo-5',word:'embrace',koreanReading:'임브레이스',language:'영어',reading:'/ɪmˈbreɪs/',meaning:'받아들이다, 껴안다',example:'Learn to embrace small changes.',translation:'작은 변화를 받아들이는 법을 배워 보세요.'},
{registeredDate:todayKey(),id:'demo-6',word:'一歩',koreanReading:'잇포',language:'일본어',reading:'いっぽ',meaning:'한 걸음',example:'毎日、一歩ずつ進みましょう。',translation:'매일 한 걸음씩 나아가 봅시다.'}
];
const $=id=>document.getElementById(id);let actual=WORDS.slice(),demo=false,lang='오늘',shown=[],revealed=new Set(),deck=[],pos=0,flipped=false;
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('word-library-saved')||'[]'))}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalize(rows){if(!Array.isArray(rows))throw Error('배열 또는 {words: [...]} 형식이어야 합니다.');if(rows.length>10000)throw Error('한 번에 최대 10,000개까지 불러올 수 있어요.');return rows.map((w,i)=>{if(!w||typeof w.word!=='string'||!w.word.trim())throw Error((i+1)+'번째 단어의 word 값을 확인해 주세요.');if(!['영어','일본어'].includes(w.language))throw Error((i+1)+'번째 단어의 language는 영어 또는 일본어여야 합니다.');return {id:String(w.id||'word-'+i+'-'+w.word),word:w.word,language:w.language,registeredDate:typeof w.registeredDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(w.registeredDate)?w.registeredDate:null,reading:String(w.reading||''),koreanReading:String(w.koreanReading||''),meaning:String(w.meaning||''),example:String(w.example||''),translation:String(w.translation||''),dictionaryUrl:safeURL(w.dictionaryUrl),notionUrl:safeURL(w.notionUrl),studyCount:typeof w.studyCount==='number'&&Number.isFinite(w.studyCount)&&w.studyCount>=0?w.studyCount:null,lastStudied:typeof w.lastStudied==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(w.lastStudied)?w.lastStudied:null}})}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function render(){const q=$('search').value.toLocaleLowerCase();shown=(demo?DEMO:actual).filter(w=>(lang==='전체'||lang==='오늘'&&w.registeredDate===todayKey()||lang==='보관'&&saved.has(w.id)||w.language===lang)&&[w.word,w.meaning,w.reading,w.koreanReading].some(x=>(x||'').toLocaleLowerCase().includes(q)));if($('sort').value==='az')shown.sort((a,b)=>a.word.localeCompare(b.word));if($('sort').value==='least')shown.sort((a,b)=>(a.studyCount??Infinity)-(b.studyCount??Infinity));$('count').textContent=(demo?'예시 · ':'')+(lang==='오늘'?'오늘 등록한 단어':lang==='전체'?'전체 단어':lang==='보관'?'보관한 단어':lang+' 단어')+' '+shown.length+'개';$('bannerText').textContent=demo?'예시 모드 · 단어와 오늘 등록 날짜는 화면 확인용이며 실제 기록이 아닙니다.':actual.length?'불러온 단어의 스냅샷입니다. 학습 정보는 원본 데이터 기준이며 자동 갱신되지 않습니다.':'연결된 단어장에서 단어가 조회되지 않았습니다. 데이터를 불러오거나 예시로 화면을 확인하세요.';$('mode').textContent=demo?'실제 단어장 보기':'예시 둘러보기';$('study').disabled=!shown.length;$('grid').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty"><h2>아직 이곳에 단어가 없어요.</h2><p>'+(lang==='오늘'?(actual.length?'오늘 등록된 단어가 없어요. 전체 탭에서 모든 단어를 확인할 수 있습니다.':'등록 날짜가 있는 단어 데이터를 불러오면 오늘의 카드가 나타나요.'):(actual.length||demo?'검색어나 필터를 바꿔 보세요.':'JSON 데이터를 불러오면 내 단어가 카드로 나타나요.'))+'</p><button class="btn" data-action="demo">예시 카드 둘러보기</button></div>';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))}
function answer(w){return '<p class="meaning">'+esc(w.meaning||'뜻 미등록')+'</p>'+(w.example||w.translation?'<div class="example">'+(w.example?'<p>'+esc(w.example)+'</p>':'')+(w.translation?'<p>'+esc(w.translation)+'</p>':'')+'</div>':'')}
function card(w,i){const visible=!$('hide').checked||revealed.has(w.id),url=safeURL(w.dictionaryUrl);return '<article class="card"><div class="cardtop"><span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><button class="iconbtn '+(saved.has(w.id)?'saved':'')+'" data-action="save" data-i="'+i+'" aria-label="'+esc(w.word)+' 보관" aria-pressed="'+saved.has(w.id)+'">'+(saved.has(w.id)?'★':'☆')+'</button></div><div class="wordrow"><h2 class="word">'+esc(w.word)+'</h2></div><p class="reading">'+esc(w.reading||'읽기 미등록')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+(demo?' (근사 표기)':'')+'</p><div class="answer">'+(visible?answer(w):'<button class="reveal" data-action="reveal" data-i="'+i+'">생각한 뒤, 뜻 확인하기</button>')+'</div><div class="cardfoot"><span>'+(demo?'예시 데이터':w.studyCount==null?'학습 정보 미등록':esc(w.studyCount)+'회 학습')+'<br>'+(w.lastStudied?'최근 '+esc(w.lastStudied):'')+'</span>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">사전 ↗</a>':w.notionUrl?'<a href="'+esc(safeURL(w.notionUrl))+'" target="_blank" rel="noopener noreferrer">원본 ↗</a>':'<span>사전 링크 미등록</span>')+'</div></article>'}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const w=shown[Number(b.dataset.i)];if(b.dataset.action==='demo'){demo=true;render()}else if(b.dataset.action==='save'){saved.has(w.id)?saved.delete(w.id):saved.add(w.id);try{localStorage.setItem('word-library-saved',JSON.stringify([...saved]))}catch{}render()}else if(b.dataset.action==='reveal'){revealed.add(w.id);render()}});
$('mode').onclick=()=>{demo=!demo;revealed.clear();render()};$('search').oninput=render;$('sort').onchange=render;$('hide').onchange=()=>{revealed.clear();render()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('5MB 이하의 JSON 파일을 선택해 주세요.');const data=JSON.parse(await f.text());actual=normalize(Array.isArray(data)?data:data.words);demo=false;lang='오늘';$('search').value='';revealed.clear();render();toast('단어 데이터를 불러왔어요.')}catch(err){toast('불러오기 실패: '+err.message)}e.target.value=''};
$('export').onclick=()=>{const b=new Blob([JSON.stringify({words:demo?DEMO:actual},null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=demo?'example-words.json':'words.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
function focusRender(){const w=deck[pos];$('progress').textContent=(demo?'예시 공부 · ':'')+(pos+1)+' / '+deck.length;$('focus').innerHTML='<span class="tag '+(w.language==='일본어'?'jp':'')+'">'+w.language+'</span><h2>'+esc(w.word)+'</h2><p class="reading">'+esc(w.reading||'')+'</p><p class="korean-reading">한글 발음 · '+esc(w.koreanReading||'미등록')+(demo?' (근사 표기)':'')+'</p><div class="focusanswer">'+(flipped?answer(w):'<p style="color:var(--muted)">어떤 뜻인지 떠올려 보세요.</p>')+'</div>';$('flip').textContent=flipped?'뜻 숨기기':'뜻 보기';$('prev').disabled=pos===0;$('next').textContent=pos===deck.length-1?'마치기 ✓':'다음 →'}
$('study').onclick=()=>{deck=shown.slice();pos=0;flipped=false;focusRender();$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();$('flip').onclick=()=>{flipped=!flipped;focusRender()};$('prev').onclick=()=>{if(pos){pos--;flipped=false;focusRender()}};$('next').onclick=()=>{if(pos===deck.length-1){$('dialog').close();toast('공부 화면을 마쳤어요. Notion 학습 기록은 별도로 남겨 주세요.')}else{pos++;flipped=false;focusRender()}};$('dialog').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}});
render();if(location.protocol!=='file:')fetch('./words.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{actual=normalize(Array.isArray(d)?d:d.words);render()}).catch(()=>{});
</script></body></html>
